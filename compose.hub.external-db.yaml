name: steamdeals

# Docker Hub 部署：使用你已有的 PostgreSQL，不启动 db 容器。
#
#   DATABASE_URL='postgres://用户:密码@主机:5432/库名' \
#     docker compose -f compose.hub.external-db.yaml up -d
#
# 数据库地址直接写在 compose 命令的环境变量里，不需要创建/编辑 .env。
# 宿主机上的 PostgreSQL 用 host.docker.internal（Linux 已映射到网关）；
# 跨机器务必加 ?sslmode=require。
#
# 首次打开 http://服务器IP:8090 会进入 /setup 初始化页。

services:
  app:
    image: yyliucha/steamdeals:latest
    restart: unless-stopped
    command: ["all"]
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      # 必填：没有提供时 compose 会直接报错，避免容器起来后连不上库
      DATABASE_URL: "${DATABASE_URL:?请通过环境变量提供 DATABASE_URL，例如 postgres://user:pass@host:5432/steamdeals}"
      TZ: ${TZ:-Asia/Shanghai}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appdata:
  logs:
