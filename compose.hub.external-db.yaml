name: steamdeals

# Docker Hub 部署：使用你已有的 PostgreSQL，不启动 db 容器。
#
#   1. 改下面 environment.DATABASE_URL 为你的连接串
#   2. docker compose -f compose.hub.external-db.yaml up -d
#
# 数据库地址直接写在 compose 文件里，不需要创建/编辑 .env。
# 宿主机上的 PostgreSQL 用 host.docker.internal（Linux 已映射到网关）；
# 跨机器务必加 ?sslmode=require。
#
# 首次打开 http://服务器IP:8090 会进入 /setup 初始化页。

services:
  app:
    image: yyliucha/steamdeals:latest
    restart: unless-stopped
    command: ["all"]
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      # 直接改下面这一行即可，不需要 .env，也不需要命令行传变量。
      # 这是 Compose 的 environment 配置，和 volumes 一样属于 compose 文件内容。
      #
      # 注意：
      #   · 密码里的 # ? / @ 等 URL 特殊字符需要 URL 编码（# → %23，? → %3F，/ → %2F，@ → %40）
      #   · 真实密码不要提交到公开仓库；可以复制成 compose.hub.external-db.local.yaml（已 gitignore）
      DATABASE_URL: "postgres://user:password@host:5432/steamdeals?sslmode=require"
      TZ: ${TZ:-Asia/Shanghai}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
      - logs:/app/logs
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appdata:
  logs:
