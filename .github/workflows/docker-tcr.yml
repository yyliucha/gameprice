name: docker-tcr

# 推送国内镜像到腾讯云 TCR 个人版。
#
# 需要在 GitHub 仓库配置两个 Secrets：
#   TCR_USERNAME = 100003189690（腾讯云账号 ID）
#   TCR_PASSWORD = TCR 个人版访问密码
#
# 手动运行：Actions → docker-tcr → Run workflow
# 打 v* 标签时也会自动跑；如果还没配 Secrets，请先手动运行。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tcr-${{ github.ref }}
  cancel-in-progress: true

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: tcb-100003189690-pljp
  APP_REPO: steamdeals
  PG_SOURCE: postgres:15-alpine
  PG_TAG: 15-alpine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-html-syntax.mjs web/index.html web/console.html web/setup.html

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # TCR 个人版官方不支持多架构构建，这里只推 linux/amd64。
      # Docker Hub 继续推 amd64 + arm64。
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ccr.ccs.tencentyun.com/tcb-100003189690-pljp/steamdeals:latest
            ccr.ccs.tencentyun.com/tcb-100003189690-pljp/steamdeals:${{ steps.version.outputs.value }}
            ccr.ccs.tencentyun.com/tcb-100003189690-pljp/steamdeals:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror PostgreSQL image
        run: |
          docker pull "$PG_SOURCE"
          docker tag "$PG_SOURCE" "$TCR_REGISTRY/$TCR_NAMESPACE/postgres:$PG_TAG"
          docker push "$TCR_REGISTRY/$TCR_NAMESPACE/postgres:$PG_TAG"

      - name: Verify manifests
        run: |
          docker buildx imagetools inspect "$TCR_REGISTRY/$TCR_NAMESPACE/steamdeals:latest"
          docker buildx imagetools inspect "$TCR_REGISTRY/$TCR_NAMESPACE/postgres:$PG_TAG"
