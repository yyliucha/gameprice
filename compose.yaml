name: steamdeals

# 默认带一个 PostgreSQL 15（和你线上 15.17 同大版本）。
# 直接用外部数据库：在 .env 里填好 DATABASE_URL，然后 `docker compose up -d app`（只起 app）。
# 注意：db 故意不设 profile —— 否则没有 .env 时 `docker compose up` 不会启动它，
# app 会连不上 db:5432。
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steamdeals}
      POSTGRES_USER: ${POSTGRES_USER:-steamdeals}
      # 默认 trust：不设密码也能起来，一步到位。数据库端口不对外暴露，
      # 只在 compose 内网可达；需要密码就设 POSTGRES_PASSWORD 并同时给 DATABASE_URL。
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: steamdeals:latest
    restart: unless-stopped
    # 一体化：同一个容器里跑调度器 + Web/API（前端 / ，控制台 /console）
    command: ["all"]
    ports:
      - "${WEB_PORT:-8090}:8080"
    # 用宿主机上现成的 PostgreSQL 时，容器里要能用 host.docker.internal 访问宿主机
    # （Linux 上 Docker 默认不提供这个名字，需要显式映射到网关）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # required: false 让"只用外部数据库"时不必启动 db（Compose ≥ 2.20）
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-steamdeals}@db:5432/${POSTGRES_DB:-steamdeals}}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ON_START: ${SEED_ON_START:-1}
      DB_WAIT_SEC: ${DB_WAIT_SEC:-60}
      RUN_MODE: ${RUN_MODE:-scheduler}
      ITAD_API_KEY: ${ITAD_API_KEY:-}
      STEAM_ENABLED: ${STEAM_ENABLED:-1}
      SONKWO_ENABLED: ${SONKWO_ENABLED:-1}
      ITAD_ENABLED: ${ITAD_ENABLED:-1}
      STEAM_INTERVAL_MIN: ${STEAM_INTERVAL_MIN:-60}
      SONKWO_INTERVAL_MIN: ${SONKWO_INTERVAL_MIN:-60}
      ITAD_INTERVAL_MIN: ${ITAD_INTERVAL_MIN:-1440}
      GOG_ENABLED: ${GOG_ENABLED:-1}
      HUMBLE_ENABLED: ${HUMBLE_ENABLED:-1}
      GOG_INTERVAL_MIN: ${GOG_INTERVAL_MIN:-720}
      GOG_REGIONS: ${GOG_REGIONS:-cn}
      HUMBLE_INTERVAL_MIN: ${HUMBLE_INTERVAL_MIN:-720}
      DISCOVER_ENABLED: ${DISCOVER_ENABLED:-0}
      DISCOVER_INTERVAL_MIN: ${DISCOVER_INTERVAL_MIN:-720}
      CHART_ON_SYNC: ${CHART_ON_SYNC:-1}
      OUT_DIR: ${OUT_DIR:-out}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-1}
      ALERTS_INTERVAL_MIN: ${ALERTS_INTERVAL_MIN:-360}
      STEAM_PROXY: ${STEAM_PROXY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      CIRCUIT_THRESHOLD: ${CIRCUIT_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_MIN: ${CIRCUIT_COOLDOWN_MIN:-360}
    volumes:
      # 日志和 SKU 清单放宿主机，容器重建不丢
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
