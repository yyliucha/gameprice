name: gameprice

# 默认带一个 PostgreSQL 15（和你线上 15.17 同大版本）。
# 若要用你自己的外部数据库：把 .env 里的 COMPOSE_PROFILES 清空、填好 DATABASE_URL，
# 然后 `docker compose up -d --build` 就只会起 app。
services:
  db:
    image: postgres:15-alpine
    profiles: ["bundled"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameprice}
      POSTGRES_USER: ${POSTGRES_USER:-gameprice}
      # 默认 trust：不设密码也能起来，一步到位。数据库端口不对外暴露，
      # 只在 compose 内网可达；需要密码就设 POSTGRES_PASSWORD 并同时给 DATABASE_URL。
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gameprice:latest
    restart: unless-stopped
    # required: false 让"只用外部数据库"时不必启动 db（Compose ≥ 2.20）
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-gameprice}@db:5432/${POSTGRES_DB:-gameprice}}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ON_START: ${SEED_ON_START:-1}
      DB_WAIT_SEC: ${DB_WAIT_SEC:-60}
      RUN_MODE: ${RUN_MODE:-scheduler}
      ITAD_API_KEY: ${ITAD_API_KEY:-}
      STEAM_ENABLED: ${STEAM_ENABLED:-1}
      SONKWO_ENABLED: ${SONKWO_ENABLED:-1}
      ITAD_ENABLED: ${ITAD_ENABLED:-1}
      STEAM_INTERVAL_MIN: ${STEAM_INTERVAL_MIN:-60}
      SONKWO_INTERVAL_MIN: ${SONKWO_INTERVAL_MIN:-60}
      ITAD_INTERVAL_MIN: ${ITAD_INTERVAL_MIN:-1440}
      GOG_ENABLED: ${GOG_ENABLED:-1}
      HUMBLE_ENABLED: ${HUMBLE_ENABLED:-1}
      GOG_INTERVAL_MIN: ${GOG_INTERVAL_MIN:-720}
      HUMBLE_INTERVAL_MIN: ${HUMBLE_INTERVAL_MIN:-720}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-1}
      ALERTS_INTERVAL_MIN: ${ALERTS_INTERVAL_MIN:-360}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      CIRCUIT_THRESHOLD: ${CIRCUIT_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_MIN: ${CIRCUIT_COOLDOWN_MIN:-360}
    volumes:
      # 日志和 SKU 清单放宿主机，容器重建不丢
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "src/cli.js", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
