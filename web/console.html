<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SteamDeals · 控制台</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#0f172a;--muted:#64748b;--border:#e5e7eb;--brand:#4f46e5;--good:#059669;--warn:#b45309;--hover:#f8fafc;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#121a2e;--fg:#e6eaf2;--muted:#93a0b8;--border:#22304d;--brand:#818cf8;--good:#34d399;--warn:#fbbf24;--hover:#18233c;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--brand);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0}
header .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;color:var(--fg)}
.spacer{flex:1}
main{padding:26px 0 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:24px 0 8px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 14px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--hover)}
.num{text-align:right;font-family:var(--mono)}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
input{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
#msg{color:var(--warn);font-size:13px;min-height:20px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/">← 返回网站</a>
  <span class="muted small">控制台</span>
  <span class="spacer"></span>
  <span id="who" class="muted small"></span>
  <button id="logout" class="btn hide">退出</button>
</div></header>

<main class="wrap">
  <h1>控制台</h1>
  <p class="muted small">只有管理员可见。普通账号可浏览网站，但不能进入这里。</p>

  <div id="loginBox" class="card" style="padding:20px;max-width:380px">
    <strong>管理员登录</strong>
    <div class="row">
      <input id="u" placeholder="用户名" autocomplete="username">
      <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <div class="row"><button id="login" class="btn primary">登录</button></div>
    <div id="msg"></div>
  </div>

  <div id="panel" class="hide">
    <h2>用户</h2>
    <div class="card"><table><thead><tr><th>用户名</th><th>角色</th><th>创建</th><th>最近登录</th></tr></thead><tbody id="users"></tbody></table></div>

    <h2>浏览排行（90 天内）</h2>
    <div class="card"><table><thead><tr><th>页面</th><th class="num">次数</th><th>最近</th></tr></thead><tbody id="views"></tbody></table></div>

    <h2>游戏标记</h2>
    <div class="card" style="padding:16px">
      <div class="row">
        <input id="appid" placeholder="Steam appid，如 413150" style="width:200px">
        <button class="btn" id="markInterest">切换 感兴趣/不感兴趣</button>
        <button class="btn" id="markOwned">切换 已拥有</button>
      </div>
      <p class="muted small">标记只影响网站上的展示与推荐，不影响价格采集与统计。</p>
      <div id="markMsg" class="small"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (v) => (v ? new Date(v).toISOString().slice(0, 16).replace('T', ' ') : '—');

async function me() {
  const d = await (await fetch('/api/me')).json();
  const admin = d.user && d.user.role === 'admin';
  $('who').textContent = d.user ? d.user.username + '（' + d.user.role + '）' : '未登录';
  $('loginBox').classList.toggle('hide', !!admin);
  $('panel').classList.toggle('hide', !admin);
  $('logout').classList.toggle('hide', !d.user);
  if (admin) await load();
  else if (d.user) $('msg').textContent = '该账号不是管理员，无法进入控制台。';
}

async function load() {
  const [u, v] = await Promise.all([(await fetch('/api/admin/users')).json(), (await fetch('/api/admin/views')).json()]);
  $('users').innerHTML = (u.users ?? []).map((x) =>
    '<tr><td>' + esc(x.username) + '</td><td>' + esc(x.role) + '</td><td class="muted small">' + when(x.created_at) +
    '</td><td class="muted small">' + when(x.last_login_at) + '</td></tr>').join('') || '<tr><td colspan="4" class="muted">还没有用户</td></tr>';
  $('views').innerHTML = (v.views ?? []).map((x) =>
    '<tr><td>' + esc(x.path) + '</td><td class="num">' + x.views + '</td><td class="muted small">' + when(x.last_at) + '</td></tr>').join('') ||
    '<tr><td colspan="3" class="muted">还没有记录（登录用户访问游戏详情会记录）</td></tr>';
}

$('login').onclick = async () => {
  $('msg').textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username: $('u').value, password: $('p').value }),
  });
  const body = await res.json();
  if (!res.ok) { $('msg').textContent = body.error ?? '登录失败'; return; }
  await me();
};

$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); await me(); };

async function mark(kind) {
  const appid = $('appid').value.trim();
  if (!/^\d+$/.test(appid)) { $('markMsg').textContent = '请填数字 appid'; return; }
  const cur = await fetch('/api/games/' + appid);
  if (!cur.ok) { $('markMsg').textContent = '库里没有这个 appid'; return; }
  const { game } = await cur.json();
  const body = kind === 'interest' ? { interested: game.interested === false } : { owned: !game.owned };
  const res = await fetch('/api/games/' + appid + '/' + kind, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  $('markMsg').textContent = res.ok ? '已更新 ' + (game.name ?? appid) : '更新失败（需要管理员）';
}
$('markInterest').onclick = () => mark('interest');
$('markOwned').onclick = () => mark('owned');

me();
</script>
</body>
</html>
