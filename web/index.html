<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SteamDeals · 跨平台最低价</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--fg:#0f172a;--muted:#64748b;--border:#e5e7eb;
  --brand:#4f46e5;--good:#059669;--good-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;
  --hover:#f8fafc;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1020;--panel:#121a2e;--fg:#e6eaf2;--muted:#93a0b8;--border:#22304d;
  --brand:#818cf8;--good:#34d399;--good-bg:#0d2b24;--warn:#fbbf24;--warn-bg:#2b2109;
  --hover:#18233c;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--brand);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#4f46e5)}
.spacer{flex:1}
button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 12px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:24px 0 60px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 14px;background:color-mix(in srgb,var(--muted) 8%,transparent);color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--hover)}
.num{text-align:right;font-family:var(--mono);font-size:13.5px}
.name{font-weight:600}
.en{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);margin:1px 2px}
.pill.low{border-color:color-mix(in srgb,var(--good) 55%,var(--border));background:var(--good-bg);color:var(--good)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--good-bg);color:var(--good);font-size:11.5px;font-weight:700;margin-left:6px}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
dialog{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);width:320px}
dialog::backdrop{background:rgba(0,0,0,.35)}
input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:14px;margin:6px 0 12px}
#msg{margin-top:10px;font-size:13px;color:var(--warn);min-height:18px}
.hide{display:none !important}
.toTop{position:fixed;right:20px;bottom:88px;z-index:40;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--fg);cursor:pointer;box-shadow:var(--shadow);font-family:inherit;opacity:.92}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><span class="dot"></span>SteamDeals</a>
  <span class="muted small">以 Steam 为准 · 跨平台最低价</span>
  <span class="spacer"></span>
  <span id="who" class="muted small"></span>
  <button id="loginBtn" class="btn">登录</button>
  <button id="logoutBtn" class="btn" hidden>退出</button>
</div></header>

<main class="wrap">
  <h1>游戏价格</h1>
  <p class="muted small" id="meta">加载中…</p>

  <div class="bar" id="tabs">
    <button class="chip on" data-tab="all">全部</button>
    <button class="chip" data-tab="on">感兴趣</button>
    <button class="chip" data-tab="off">不感兴趣</button>
    <button class="chip" data-tab="owned">已拥有</button>
    <input id="q" placeholder="搜索游戏（中文 / 英文）" style="max-width:250px;margin-left:8px">
    <span class="spacer"></span>
    <button class="chip" data-sort="discount">折扣</button>
    <button class="chip" data-sort="price">价格</button>
    <button class="chip" data-sort="name">名称</button>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th>游戏</th><th class="num">现价</th><th class="num">原价</th>
        <th class="num">折扣</th><th>各平台</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
    </table>

  </div>

    <div class="card pad pagerbar" id="pager" style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;margin-top:12px">
    <span class="small muted" id="pgInfo"></span>
    <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <button class="chip" id="pgFirst" title="首页">«</button>
      <button class="chip" id="pgPrev">‹ 上一页</button>
      <span id="pgNums" style="display:flex;gap:4px"></span>
      <button class="chip" id="pgNext">下一页 ›</button>
      <button class="chip" id="pgLast" title="末页">»</button>
      <select id="pgSize" style="padding:4px 6px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg)">
        <option value="50">50 条/页</option>
        <option value="100">100 条/页</option>
        <option value="20">20 条/页</option>
      </select>
    </span>
  </div>
</main>

<dialog id="loginDlg">
  <div>
    <strong id="loginTitle">登录</strong>
    <div class="bar" style="margin:8px 0">
      <button class="chip on" data-lmode="pwd" type="button">密码登录</button>
      <button class="chip" data-lmode="code" type="button">邮箱验证码</button>
    </div>
    <div id="pwdPane">
      <input id="lu" placeholder="用户名" autocomplete="username">
      <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <div id="codePane" class="hide">
      <input id="le" type="email" placeholder="账号绑定的邮箱">
      <div class="bar" style="margin:4px 0">
        <input id="lc" placeholder="6 位验证码" style="width:130px">
        <button class="btn" id="sendCode" type="button">发送验证码</button>
      </div>
      <input id="lnewp" type="password" placeholder="新密码（忘记密码时填）" class="hide">
    </div>
    <div class="bar" style="justify-content:flex-end;margin-top:8px">
      <button class="btn" id="cancelLogin" type="button">取消</button>
      <button class="btn primary" id="doLogin" type="button">登录</button>
    </div>
    <div id="msg" class="small" style="color:var(--warn);min-height:18px"></div>
    <div class="small muted"><a href="#" id="forgotLink">忘记密码？</a></div>
  </div>
</dialog>

<dialog id="detailDlg">
  <div id="detail"></div>
</dialog>

<dialog id="adminDlg">
  <div id="adminBox"></div>
</dialog>

<script>
const state = {
  pageSize: 50,
  page: 1, games: [], tab: 'all', sort: 'discount', user: null, prefs: null };

// 访客偏好存在浏览器本地：不涉及账号、不上传服务端。
// 登录后以服务端偏好为准，但界面位置（tab/排序）仍然本地记忆。
const LOCAL_KEY = 'steamdeals.prefs.v1';
function readLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveLocal() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify({ tab: state.tab, sort: state.sort }));
  } catch {
    /* 隐私模式下可能不可写，忽略 */
  }
}
function applyLocal() {
  const saved = readLocal();
  if (!saved) return false;
  if (saved.tab) state.tab = saved.tab;
  if (saved.sort) state.sort = saved.sort;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === state.tab));
  document.querySelectorAll('[data-sort]').forEach((b) => b.classList.toggle('on', b.dataset.sort === state.sort));
  return true;
}

const yuan = (cents) => (cents == null ? '—' : '¥' + (cents / 100).toFixed(2));
const pct = (d) => (d ? '-' + d + '%' : '—');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function visible(game) {
  if (state.tab === 'owned') return game.owned === true;
  if (game.owned === true) return false;          // 已拥有默认收起
  if (state.tab === 'on') return game.interested !== false;
  if (state.tab === 'off') return game.interested === false;
  return true;
}

function sorted(list) {
  const rows = [...list];
  if (state.sort === 'price') rows.sort((a, b) => (a.current_low ?? Infinity) - (b.current_low ?? Infinity));
  else if (state.sort === 'name') rows.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hans-CN'));
  // 稳定排序：同折扣同价时按名称，避免分页时顺序跳动
  else rows.sort((a, b) => (b.discount ?? 0) - (a.discount ?? 0) || (a.current_low ?? Infinity) - (b.current_low ?? Infinity) || String(a.name).localeCompare(String(b.name), 'zh-Hans-CN'));
  return rows;
}

function render() {
  const kw = ((document.getElementById('q') || {}).value || '').trim().toLowerCase();
  const matched = (g) => !kw || [g.name, g.name_en].some((v) => String(v || '').toLowerCase().includes(kw));
  const filtered = sorted(state.games.filter(visible).filter(matched));
  const PAGE_SIZE = state.pageSize || 50;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (!state.page || state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const start = (state.page - 1) * PAGE_SIZE;
  const list = filtered.slice(start, start + PAGE_SIZE);
  const info = document.getElementById('pgInfo');
  if (info) info.textContent = '共 ' + filtered.length + ' 款 · 第 ' + state.page + ' / ' + totalPages + ' 页 · 本页 ' + list.length + ' 条';
  const nums = document.getElementById('pgNums');
  if (nums) {
    const from = Math.max(1, state.page - 3);
    const to = Math.min(totalPages, from + 6);
    let html = '';
    for (let i = from; i <= to; i += 1) {
      const on = i === state.page ? ' style="background:var(--brand);border-color:var(--brand);color:#fff"' : '';
      html += '<button class="chip" data-pg="' + i + '"' + on + '>' + i + '</button>';
    }
    nums.innerHTML = html;
    nums.querySelectorAll('button[data-pg]').forEach(function (btn) {
      btn.onclick = function () { state.page = Number(btn.dataset.pg); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    });
  }
  if (document.getElementById('pgPrev')) document.getElementById('pgPrev').disabled = state.page <= 1;
  if (document.getElementById('pgFirst')) document.getElementById('pgFirst').disabled = state.page <= 1;
  if (document.getElementById('pgNext')) document.getElementById('pgNext').disabled = state.page >= totalPages;
  if (document.getElementById('pgLast')) document.getElementById('pgLast').disabled = state.page >= totalPages;
  const tbody = document.getElementById('rows');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">这个分类下没有游戏</td></tr>';
    return;
  }
  tbody.innerHTML = list.map((g) => {
    const all = Array.isArray(g.all_offers) ? g.all_offers : [];
    // 固定展示顺序：Steam 永远第一，其余按价格升序、同价按平台名 —— 每次渲染都一致
    const offers = all.slice().sort((a, b) => {
      const as = a.platform === 'steam' ? 0 : 1;
      const bs = b.platform === 'steam' ? 0 : 1;
      if (as !== bs) return as - bs;
      if (a.price !== b.price) return a.price - b.price;
      return String(a.platform).localeCompare(String(b.platform));
    });
    const cheapest = all.reduce((min, o) => (min == null || o.price < min ? o.price : min), null);
    const pills = offers.slice(0, 3).map((o) =>
      '<span class="pill' + (o.price === cheapest ? ' low' : '') + '">' +
      esc(o.platform_name ?? o.platform) + ' ' + yuan(o.price) + '</span>').join(' ');
    const others = all.filter((o) => o.platform !== 'steam').sort((a, b) => a.price - b.price);
    const gap = others.length ? others[0].price : null;
    const atLow = g.hist_low != null && g.current_low != null && g.current_low <= g.hist_low;
    const owned = g.owned === true ? '<span class="tag warn">已拥有</span>' : '';
    const en = g.name_en && g.name_en !== g.name ? '<div class="en">' + esc(g.name_en) + '</div>' : '';
    const link = '<a href="#" data-appid="' + esc(g.steam_appid ?? '') + '" data-gid="' + esc(g.id) + '">' + esc(g.name) + '</a>';
    return '<tr>' +
      '<td><div class="name">' + link + (atLow ? '<span class="tag">史低</span>' : '') + owned + '</div>' + en + '</td>' +
      (function(){
        var steam = null;
        for (var i = 0; i < offers.length; i++) if (offers[i].platform === 'steam') steam = offers[i];
        var base = steam ? steam.price : g.current_low;
        var low = others.length ? others[0] : null; // 参考价只看非 Steam 平台，避免和自己比
        var note = steam && low
          ? '<div class="small muted">其他平台最低 ' + yuan(low.price) + '（' + esc(low.platform_name || low.platform) + '）</div>'
          : (g.steam_price == null && low ? '<div class="small muted">Steam 无价，取最低 ' + esc(low.platform_name || low.platform) + '</div>' : '');
        return '<td class="num">' + yuan(base) + note + '</td>';
      })() +
      '<td class="num">' + yuan(g.current_original) + '</td>' +
      '<td class="num">' + pct(g.discount) + '</td>' +
      '<td>' + (pills || '<span class="muted">—</span>') + '</td>' +
      '</tr>';
  }).join('');
}

async function load() {
  const res = await fetch('/api/games?limit=500&owned=include');
  const data = await res.json();
  state.games = data.games ?? [];
  document.getElementById('meta').textContent =
    '共 ' + state.games.length + ' 款 · 采集由后台调度器负责，前台只读';
  render();
}

async function me() {
  const data = await (await fetch('/api/me')).json();
  state.user = data.user;
  state.prefs = data.prefs;
  const who = document.getElementById('who');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  if (data.user) {
    who.textContent = data.user.username + (data.user.role === 'admin' ? '（管理员）' : '');
    loginBtn.hidden = true;
    logoutBtn.hidden = false;
    // 登录用户的偏好直接影响默认视图
    if (data.prefs?.hide_uninterested) {
      state.tab = 'on';
      document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === 'on'));
    }
    if (data.prefs?.only_discount) state.sort = 'discount';
  } else {
    who.textContent = '未登录（浏览不受影响）';
    loginBtn.hidden = false;
    logoutBtn.hidden = true;
  }
}

/** 后台：用户列表 + 浏览统计。仅管理员可见。 */
async function openAdmin() {
  const dlg = document.getElementById('adminDlg');
  const box = document.getElementById('adminBox');
  box.innerHTML = '<p class="muted">加载中…</p>';
  dlg.showModal();
  const [u, v] = await Promise.all([
    (await fetch('/api/admin/users')).json(),
    (await fetch('/api/admin/views')).json(),
  ]);
  const users = (u.users ?? []).map((x) =>
    '<tr><td>' + esc(x.username) + '</td><td>' + esc(x.role) + '</td><td class="muted small">' +
    (x.last_login_at ? new Date(x.last_login_at).toISOString().slice(0, 16).replace('T', ' ') : '—') + '</td></tr>').join('')
    || '<tr><td colspan="3" class="muted">还没有用户</td></tr>';
  const views = (v.views ?? []).map((x) =>
    '<tr><td>' + esc(x.path) + '</td><td class="num">' + x.views + '</td></tr>').join('')
    || '<tr><td colspan="2" class="muted">还没有浏览记录（登录后访问游戏详情会记录）</td></tr>';
  box.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<strong>后台管理</strong><button class="btn" id="closeAdmin">关闭</button></div>' +
    '<h3 style="font-size:14px;margin:16px 0 6px">用户</h3>' +
    '<div class="card"><table><thead><tr><th>用户名</th><th>角色</th><th>最近登录</th></tr></thead><tbody>' + users + '</tbody></table></div>' +
    '<h3 style="font-size:14px;margin:16px 0 6px">浏览排行</h3>' +
    '<div class="card"><table><thead><tr><th>页面</th><th class="num">次数</th></tr></thead><tbody>' + views + '</tbody></table></div>' +
    '<p class="muted small" style="margin-top:10px">用户由 CLI 创建：node src/cli.js user add &lt;用户名&gt; [--admin]</p>';
  document.getElementById('closeAdmin').onclick = () => dlg.close();
}


document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.dataset.tab;
  const sort = e.target.dataset.sort;
  if (tab) {
    state.tab = tab;
    [...document.querySelectorAll('[data-tab]')].forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    saveLocal();
    render();
  }
  if (sort) {
    state.sort = sort;
    [...document.querySelectorAll('[data-sort]')].forEach((b) => b.classList.toggle('on', b.dataset.sort === sort));
    saveLocal();
    render();
  }
});

const dlg = document.getElementById('loginDlg');
document.getElementById('loginBtn').addEventListener('click', () => dlg.showModal());
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  await me();
});
let loginMode = 'pwd';
let resetMode = false;
function syncLoginUI(){
  const pwd = document.getElementById('pwdPane');
  const code = document.getElementById('codePane');
  const np = document.getElementById('lnewp');
  const title = document.getElementById('loginTitle');
  const btn = document.getElementById('doLogin');
  const forgot = document.getElementById('forgotLink');
  const isPwd = loginMode === 'pwd';
  pwd.classList.toggle('hide', !isPwd);
  code.classList.toggle('hide', isPwd);
  np.classList.toggle('hide', !resetMode);
  title.textContent = resetMode ? '重置密码' : (isPwd ? '登录' : '邮箱验证码登录');
  btn.textContent = resetMode ? '重置密码' : '登录';
  forgot.classList.toggle('hide', resetMode || !isPwd);
  document.querySelectorAll('[data-lmode]').forEach(function(b){ b.classList.toggle('on', b.dataset.lmode===loginMode); });
  document.getElementById('msg').textContent='';
}
document.querySelectorAll('[data-lmode]').forEach(function(b){ b.addEventListener('click',function(){ resetMode=false; loginMode=b.dataset.lmode; syncLoginUI(); }); });
document.getElementById('cancelLogin').onclick=function(){ document.getElementById('loginDlg').close(); };
document.getElementById('forgotLink').onclick=function(ev){
  ev.preventDefault(); resetMode=true; loginMode='code'; syncLoginUI();
};
document.getElementById('loginBtn').addEventListener('click',function(){ resetMode=false; loginMode='pwd'; syncLoginUI(); });
document.getElementById('sendCode').onclick=async function(){
  const msg=document.getElementById('msg'); msg.textContent='发送中…';
  try{
    const res=await fetch('/api/auth/email/request',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({ email:document.getElementById('le').value.trim(), purpose: resetMode?'reset':'login' })});
    const b=await res.json();
    msg.textContent = res.ok ? (b.hint||'验证码已发送') : (b.error||'发送失败');
  }catch(e){ msg.textContent='发送失败：'+e.message; }
};
document.getElementById('doLogin').onclick=async function(){
  const msg=document.getElementById('msg'); msg.textContent='';
  try{
    if(loginMode==='pwd'){
      const res=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({ username:document.getElementById('lu').value.trim(), password:document.getElementById('lp').value })});
      const b=await res.json();
      if(!res.ok){ msg.textContent=b.error||'登录失败'; return; }
      document.getElementById('loginDlg').close(); await me(); return;
    }
    const payload={ email:document.getElementById('le').value.trim(), code:document.getElementById('lc').value.trim(), purpose: resetMode?'reset':'login' };
    if(resetMode) payload.password=document.getElementById('lnewp').value;
    const res=await fetch('/api/auth/email/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    const b=await res.json();
    if(!res.ok){ msg.textContent=b.error||'验证失败'; return; }
    msg.textContent=b.message||'';
    if(!resetMode){ document.getElementById('loginDlg').close(); await me(); }
  }catch(e){ msg.textContent='失败：'+e.message; }
};

function chartSvg(series) {
  const pts = (series ?? []).filter((p) => p && p.price_cents != null);
  if (pts.length < 2) return '<p class="muted small">数据不足，采集几天后会有走势</p>';
  const W = 620, H = 150, pad = 24;
  const prices = pts.map((p) => p.price_cents);
  const min = Math.min(...prices), max = Math.max(...prices);
  const span = max - min || 1;
  const step = (W - pad * 2) / (pts.length - 1);
  const xy = pts.map((p, i) => [pad + i * step, pad + (H - pad * 2) * (1 - (p.price_cents - min) / span)]);
  const line = xy.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = line + ' L' + (W - pad).toFixed(1) + ',' + (H - pad) + ' L' + pad + ',' + (H - pad) + ' Z';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    '<path d="' + area + '" fill="rgba(14,165,233,.12)"/>' +
    '<path d="' + line + '" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>' +
    '<text x="' + pad + '" y="' + (H - 6) + '" font-size="11" fill="#94a3b8">' + esc(pts[0].day) + '</text>' +
    '<text x="' + (W - pad) + '" y="' + (H - 6) + '" font-size="11" fill="#94a3b8" text-anchor="end">' + esc(pts[pts.length - 1].day) + '</text>' +
    '<text x="' + pad + '" y="' + (pad - 6) + '" font-size="11" fill="#94a3b8">最高 ' + yuan(max) + '</text>' +
    '<text x="' + (W - pad) + '" y="' + (pad - 6) + '" font-size="11" fill="#94a3b8" text-anchor="end">最低 ' + yuan(min) + '</text>' +
    '</svg>';
}

async function openDetail(appid, gid) {
  const dlg = document.getElementById('detailDlg');
  const box = document.getElementById('detail');
  box.innerHTML = '<p class="muted">加载中…</p>';
  dlg.showModal();
  const res = await fetch(appid ? '/api/games/' + appid : '/api/games/by-id/' + gid);
  if (!res.ok) { box.innerHTML = '<p class="muted">没有这个游戏</p>'; return; }
  const d = await res.json();
  const g = d.game;
  const facts = [];
  if (g.developers?.length) facts.push('开发商 ' + esc(g.developers.join(' / ')));
  if (g.publishers?.length) facts.push('发行商 ' + esc(g.publishers.join(' / ')));
  const genres = (g.genres ?? []).filter((x) => !String(x).startsWith('tag:'));
  if (genres.length) facts.push('分类 ' + genres.map((x) => '<span class="pill">' + esc(x) + '</span>').join(' '));

  const offers = (d.offers ?? []).map((o) =>
    '<tr><td>' + esc(o.platform_name ?? o.platform_code) + '</td>' +
    '<td class="num">' + yuan(o.price_cents) + '</td>' +
    '<td class="num">' + yuan(o.original_cents) + '</td>' +
    '<td class="num">' + pct(o.discount_pct) + '</td>' +
    '<td>' + (o.buy_url ? '<a href="' + esc(o.buy_url) + '" target="_blank" rel="noopener noreferrer nofollow">去购买</a>' : '—') + '</td></tr>'
  ).join('') || '<tr><td colspan="5" class="muted">当前没有在售报价</td></tr>';

  const admin = state.user?.role === 'admin'
    ? '<div class="bar"><button class="btn" id="toggleInterest">' + (g.interested === false ? '标记为感兴趣' : '标记不感兴趣') + '</button>' +
      '<button class="btn" id="toggleOwned">' + (g.owned ? '取消已拥有' : '标记已拥有') + '</button></div>'
    : '';

  box.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:start;gap:12px">' +
    '<div><strong style="font-size:18px">' + esc(g.name) + '</strong>' +
    (g.name_en && g.name_en !== g.name ? '<div class="en">' + esc(g.name_en) + '</div>' : '') +
    '<div class="muted small">' + facts.join(' · ') + '</div></div>' +
    '<button class="btn" id="closeDetail">关闭</button></div>' +
    '<div class="bar"><span class="pill">现价 ' + yuan(g.current_low) + '</span>' +
    '<span class="pill">史低 ' + yuan(g.hist_low) + '</span>' +
    '<span class="pill">折扣 ' + pct(g.discount) + '</span></div>' +
    chartSvg(d.series) + admin +
    '<div class="card" style="margin-top:12px"><table><thead><tr><th>平台</th><th class="num">价格</th><th class="num">原价</th><th class="num">折扣</th><th>链接</th></tr></thead><tbody>' + offers + '</tbody></table></div>';

  document.getElementById('closeDetail').onclick = () => dlg.close();
  if (admin) {
    document.getElementById('toggleInterest').onclick = async () => {
      await fetch('/api/games/' + appid + '/interest', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ interested: g.interested === false }),
      });
      dlg.close(); await load();
    };
    document.getElementById('toggleOwned').onclick = async () => {
      await fetch('/api/games/' + appid + '/owned', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ owned: !g.owned }),
      });
      dlg.close(); await load();
    };
  }
}

(function bindSearch() {
  const box = document.getElementById('q');
  if (!box) return;
  box.addEventListener('input', function () {
    clearTimeout(window.__qTimer);
    window.__qTimer = setTimeout(render, 150);

(function backToTop() {
  const b = document.getElementById('toTop');
  if (!b) return;
  window.addEventListener('scroll', function () { b.style.display = window.scrollY > 400 ? 'block' : 'none'; });
  b.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
})();

(function pagers() {
  const prev = document.getElementById('pgPrev');
  const next = document.getElementById('pgNext');
  const go = document.getElementById('pgGo');
  if (prev) prev.onclick = function () { state.page = Math.max(1, (state.page || 1) - 1); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (next) next.onclick = function () { state.page = (state.page || 1) + 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (go) go.onclick = function () {
    const n = Number((document.getElementById('pgJump') || {}).value || 1);
    if (n > 0) { state.page = n; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };
})();

// 分页：事件委托，避免重渲染丢失绑定
(function frontPagerDelegate() {
  ['pgPrev','pgNext','pgFirst','pgLast','pgGo'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.onclick = null;
  });
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const total = (function () {
      const kw = ((document.getElementById('q') || {}).value || '').trim().toLowerCase();
      const matched = function (g) { return !kw || [g.name, g.name_en].some(function (v) { return String(v || "").toLowerCase().includes(kw); }); };
      return sorted(state.games.filter(visible).filter(matched)).length;
    })();
    const size = state.pageSize || 50;
    const pages = Math.max(1, Math.ceil(total / size));
    const go = function (n) { state.page = Math.min(Math.max(n, 1), pages); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    if (btn.dataset.pg) return go(Number(btn.dataset.pg));
    if (btn.id === 'pgPrev') return go((state.page || 1) - 1);
    if (btn.id === 'pgNext') return go((state.page || 1) + 1);
    if (btn.id === 'pgFirst') return go(1);
    if (btn.id === 'pgLast') return go(pages);
    if (btn.id === 'pgGo') {
      const n = Number((document.getElementById('pgJump') || {}).value || 1);
      if (n > 0) go(n);
    }
  });
  const sel = document.getElementById('pgSize');
  if (sel) sel.onchange = function () { state.pageSize = Number(sel.value) || 50; state.page = 1; render(); };
})();
